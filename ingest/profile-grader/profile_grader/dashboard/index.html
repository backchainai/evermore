<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profile Grader</title>
<style>
  :root {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --ink: #1e293b;
    --muted: #64748b;
    --line: #e2e8f0;
    --brand: #2563a8;      /* cool blue */
    --brand-ink: #0f3d6e;
    --green: #2f9e5f;
    --green-bg: #e6f5ec;
    --amber: #d99420;
    --amber-bg: #fbf1dc;
    --red: #d0503e;
    --red-bg: #fbe6e2;
    --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.05);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    background: linear-gradient(180deg, #ffffff, #f7f9fc);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
  }
  .bar {
    max-width: 960px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brandmark { font-weight: 700; font-size: 18px; color: var(--brand-ink); letter-spacing: -.2px; }
  .brandmark small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
  .jump { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .jump select {
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--ink); font-size: 14px; min-width: 190px;
  }
  main { max-width: 960px; margin: 0 auto; padding: 24px 20px 64px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 30px 0 12px; }
  .lead { color: var(--muted); margin: 4px 0 0; }

  /* ---- reference example cards ---- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--green);
    border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer;
  }
  .card:hover { border-color: var(--brand); }
  .card .nm { font-weight: 600; font-size: 16px; }
  .card .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* ---- ranked bar list ---- */
  .rows { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .row { display: grid; grid-template-columns: 150px 1fr 54px; align-items: center; gap: 12px;
         padding: 11px 16px; border-top: 1px solid var(--line); cursor: pointer; }
  .row:first-child { border-top: none; }
  .row:hover { background: #f8fafc; }
  .row .nm { font-weight: 600; display: flex; align-items: center; gap: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { background: #eef2f7; border-radius: 6px; height: 20px; overflow: hidden; }
  .fill { height: 100%; border-radius: 6px; }
  .score { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .flagdot { font-size: 13px; line-height: 1; }

  /* ---- shared band chips ---- */
  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .g { color: var(--green); } .a { color: var(--amber); } .r { color: var(--red); }
  .chip.g { background: var(--green-bg); } .chip.a { background: var(--amber-bg); } .chip.r { background: var(--red-bg); }
  .fill.g { background: var(--green); } .fill.a { background: var(--amber); } .fill.r { background: var(--red); }
  .card.g { border-left-color: var(--green); } .card.a { border-left-color: var(--amber); } .card.r { border-left-color: var(--red); }

  .legend { color: var(--muted); font-size: 13px; margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; }
  .legend b { font-weight: 600; }

  /* ---- detail ---- */
  .back { font-size: 14px; }
  .head { display: flex; align-items: flex-start; gap: 18px; margin: 12px 0 8px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-size: 28px; letter-spacing: -.5px; }
  .facets { color: var(--muted); font-size: 14px; margin-top: 3px; }
  .bigscore { margin-left: auto; text-align: right; }
  .bigscore .num { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .bigscore .pct { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-top: 16px; }
  .callout { border-left: 4px solid var(--brand); background: #eef4fb; }
  .callout h3 { margin: 0 0 4px; font-size: 15px; color: var(--brand-ink); }
  .flagbox { border-left: 4px solid var(--red); background: var(--red-bg); }
  .flagbox.high { border-left-color: var(--red); }
  .flagbox .f { margin: 6px 0; }
  .flagbox .f b { color: var(--red); }

  .crit { border-top: 1px solid var(--line); }
  .crit:first-of-type { border-top: none; }
  .crit summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 62px 1fr 66px;
    gap: 14px; align-items: center; padding: 14px 10px; margin: 0 -10px; border-radius: 8px; transition: background .12s; }
  .crit summary:hover { background: #eef4fb; }
  .crit summary:hover .cl { color: var(--brand-ink); }
  .crit summary::-webkit-details-marker { display: none; }
  .grade { font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: -.5px; text-align: left; }
  .grade.g { color: var(--green); } .grade.a { color: var(--amber); } .grade.r { color: var(--red); }
  .cinfo { min-width: 0; }
  .crit .cl { font-weight: 600; }
  .crit .cq { color: var(--muted); font-size: 13px; margin-top: 1px; }
  .crit .cpts { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1.15; }
  .crit .cpts .ptslbl { color: var(--muted); font-size: 11px; }
  .crit .body { margin: 10px 0 14px; padding-left: 2px; font-size: 14px; }
  .crit .quote { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin: 8px 0; color: var(--ink); font-style: italic; }
  .crit .tip { background: #eef4fb; border-radius: 8px; padding: 9px 12px; margin-top: 8px; font-size: 13.5px; }
  .crit .tip b { color: var(--brand-ink); }
  .crit .hits code { background: #fff3cd; border-radius: 4px; padding: 1px 5px; margin-right: 4px; }
  .caret { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
    border-radius: 50%; background: #e7eefb; color: var(--brand); font-size: 11px; margin-left: 8px;
    vertical-align: middle; transition: transform .15s ease, background .12s; }
  .crit summary:hover .caret { background: var(--brand); color: #fff; }
  details[open] > summary .caret { transform: rotate(90deg); }

  .copy h4 { margin: 14px 0 3px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .copy p { margin: 0 0 4px; }
  .copy mark { background: #fff3cd; border-radius: 3px; padding: 0 2px; }
  .empty { color: var(--red); font-style: italic; }
  .loading { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brandmark">Profile Grader
      <small>Research-backed adoption-copy scoring</small>
    </div>
    <div class="jump">
      <label for="jump" style="color:var(--muted);font-size:13px">Jump to</label>
      <select id="jump"><option value="">Select an animal…</option></select>
    </div>
  </div>
</header>
<main id="app"><div class="loading">Loading…</div></main>

<script>
const API = "";                        // same-origin
let INDEX = null;                      // {dimensions, profiles, ...}
const RECORDS = {};                    // slug -> record cache

// ---- bands -----------------------------------------------------------------
// Band keys and labels come from the API (index.bands, per-row `band`, per-dim `band`).
// The functions below are fallbacks used only if a server band field is absent.
function band100(v){ return v >= 65 ? "g" : v >= 45 ? "a" : "r"; }   // 0-100 total
function band4(v){ return v >= 3 ? "g" : v >= 2 ? "a" : "r"; }        // 0-4 dimension
let BAND_LABEL = { g: "Reference-worthy", a: "Needs work", r: "Needs rewrite" };

// Escape for both text and attribute contexts (quotes included) — record content
// (names, copy, URLs) originates from scraped third-party profiles and is untrusted.
function esc(s){
  return (s||"").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmt(v){ return (Math.round(v*10)/10).toFixed(v % 1 ? 1 : 0); }
// Only render links whose scheme is http(s); blocks javascript:/data: URLs.
function safeUrl(u){
  try { const p = new URL(u); return (p.protocol === "http:" || p.protocol === "https:") ? p.href : null; }
  catch { return null; }
}

// ---- boot ------------------------------------------------------------------
async function boot(){
  try {
    INDEX = await (await fetch(API + "/api/index")).json();
    if (INDEX.bands?.score) BAND_LABEL = Object.fromEntries(INDEX.bands.score.map(b => [b.key, b.label]));
  } catch(e){
    document.getElementById("app").innerHTML =
      '<div class="loading">No scored data found. Run <code>grade score</code>, then reload.</div>';
    return;
  }
  // Jump list is a find-by-name control: sort alphabetically, not by score.
  const sorted = [...INDEX.profiles].sort((a,b) => (a.name||a.slug).localeCompare(b.name||b.slug));
  const jump = document.getElementById("jump");
  for (const p of sorted){
    const o = document.createElement("option");
    o.value = p.slug; o.textContent = `${p.name} · ${fmt(p.raw)}`;
    jump.appendChild(o);
  }
  jump.onchange = () => { if (jump.value) location.hash = "#/p/" + jump.value; };
  route();
}
window.addEventListener("hashchange", route);

function route(){
  const m = location.hash.match(/^#\/p\/([a-z0-9-]+)/i);
  document.getElementById("jump").value = m ? m[1] : "";
  if (m) renderDetail(m[1]); else renderLanding();
}

// ---- landing ---------------------------------------------------------------
function renderLanding(){
  const ps = [...INDEX.profiles].sort((a,b) => b.raw - a.raw);
  const mean = ps.reduce((s,p) => s + p.raw, 0) / ps.length;
  const examples = ps.filter(p => (p.band || band100(p.raw)) === "g" && !(p.flags||[]).length).slice(0, 4);
  const max = Math.max(100, ...ps.map(p => p.raw));

  let h = `<p class="lead">${ps.length} profiles scored · cohort average <b>${fmt(mean)}</b> / 100.
    Green profiles are worth copying from; red and amber are where to spend editing time.</p>`;

  if (examples.length){
    h += `<h2>Reference examples: study these</h2><div class="cards">`;
    for (const p of examples){
      h += `<div class="card g" data-slug="${esc(p.slug)}">
        <div class="nm">${esc(p.name)}</div>
        <div class="sub">${fmt(p.raw)} / 100 · ${BAND_LABEL.g}</div></div>`;
    }
    h += `</div>`;
  }

  h += `<h2>Every profile, best first</h2><div class="rows">`;
  for (const p of ps){
    const b = p.band || band100(p.raw), w = Math.round(p.raw / max * 100);
    const flags = (p.flags||[]).length
      ? `<span class="flagdot" title="${esc((p.flags||[]).join(', '))}">⚑</span>` : "";
    h += `<div class="row" data-slug="${esc(p.slug)}">
      <div class="nm">${esc(p.name)} ${flags}</div>
      <div class="track"><div class="fill ${b}" style="width:${w}%"></div></div>
      <div class="score ${b}">${fmt(p.raw)}</div></div>`;
  }
  h += `</div>
    <div class="legend">
      <span><b class="g">■</b> ${BAND_LABEL.g} (65+)</span>
      <span><b class="a">■</b> ${BAND_LABEL.a} (45–64)</span>
      <span><b class="r">■</b> ${BAND_LABEL.r} (under 45)</span>
      <span>⚑ has a quality flag (open the profile to see it)</span>
    </div>`;
  document.getElementById("app").innerHTML = h;
}
// Event delegation: any [data-slug] element navigates. Avoids inline onclick with
// data interpolated into a JS-string-in-HTML-attribute context.
document.getElementById("app").addEventListener("click", e => {
  const el = e.target.closest("[data-slug]");
  if (el) location.hash = "#/p/" + el.dataset.slug;
});

// ---- detail ----------------------------------------------------------------
async function renderDetail(slug){
  const app = document.getElementById("app");
  app.innerHTML = '<div class="loading">Loading profile…</div>';
  let r = RECORDS[slug];
  if (!r){
    try { r = RECORDS[slug] = await (await fetch(API + "/api/profile/" + slug)).json(); }
    catch(e){ app.innerHTML = '<div class="loading">Profile not found.</div>'; return; }
  }
  const b = r.band || band100(r.raw);
  const flagged = (r.flags||[]).length > 0;
  // A high-scoring profile with a quality flag is not a clean example: don't call it
  // "Reference-worthy". The flag box below explains the caveat.
  const chipLabel = (b === "g" && flagged) ? "Strong copy, has a flag" : BAND_LABEL[b];
  const facet = [r.breed, r.sex, r.age_raw, r.weight_raw && (r.weight_raw)].filter(Boolean).join(" · ");
  const url = safeUrl(r.url);

  let h = `<a class="back" href="#/">← All profiles</a>
    <div class="head">
      <div>
        <h1>${esc(r.name)}</h1>
        <div class="facets">${esc(facet)}${url ? ` · <a href="${esc(url)}" target="_blank" rel="noopener">live profile ↗</a>` : ""}</div>
        <div style="margin-top:8px"><span class="chip ${b}">${esc(chipLabel)}</span></div>
      </div>
      <div class="bigscore">
        <div class="num ${b}">${fmt(r.raw)}</div>
        <div class="pct">out of 100${r.cohort_percentile!=null ? ` · ${fmt(r.cohort_percentile)}th pct of ${r.species}s` : ""}</div>
      </div>
    </div>`;

  // flags — separate from score
  if ((r.flags||[]).length){
    h += `<div class="panel flagbox">
      <h3 style="margin:0 0 6px;color:var(--red)">Quality flags: fix the fact, not the wording</h3>`;
    for (const f of r.flags){
      h += `<div class="f"><b>${esc(f.label)}</b> (${esc(f.severity)}): ${esc(f.detail)}</div>`;
    }
    h += `</div>`;
  }

  // fix this first
  if ((r.fix_list||[]).length){
    const top = r.fix_list[0];
    const tip = (r.dimensions.find(d => d.id === top.dimension)||{}).tip || "";
    h += `<div class="panel callout">
      <h3>Fix this first: ${esc(top.label)}</h3>
      <div>Biggest opportunity: up to <b>${fmt(top.recoverable_points)} points</b> to gain here.</div>
      ${tip ? `<div style="margin-top:6px;color:var(--muted)">${esc(tip)}</div>` : ""}
    </div>`;
  }

  // per-criteria — ordered by opportunity (recoverable points desc)
  const dims = [...r.dimensions].sort((a,b) => b.recoverable_points - a.recoverable_points);
  h += `<div class="panel"><h3 style="margin:0 0 4px">How it scored, by criterion</h3>
    <div style="color:var(--muted);font-size:13px;margin-bottom:6px">The percentage is points earned on that criterion, color-coded green / amber / red. Rows are ordered by where the most points are available; click any row for the grader's read.</div>`;
  for (const d of dims){
    const cb = d.band || band4(d.score), pct = Math.round(d.weighted_points / d.weight * 100);
    h += `<details class="crit">
      <summary>
        <div class="grade ${cb}">${pct}%</div>
        <div class="cinfo"><span class="cl">${esc(d.label)}</span><span class="caret">▸</span>
          <div class="cq">${esc(d.plain||"")}</div></div>
        <div class="cpts"><b>${fmt(d.weighted_points)}</b> / ${d.weight}<br><span class="ptslbl">points</span></div>
      </summary>
      <div class="body">${critBody(d)}</div>
    </details>`;
  }
  h += `</div>`;

  // the copy itself, with deterministic hits highlighted
  h += renderCopy(r);

  app.innerHTML = h;
}

function critBody(d){
  const det = d.detail || {};
  let out = "";
  if (d.method === "judge"){
    if (det.rationale) out += `<div>${esc(det.rationale)}</div>`;
    if (det.quote) out += `<div class="quote">“${esc(det.quote)}”</div>`;
    if (det.coverage && typeof det.coverage === "object"){
      const pill = st => st === "covered" ? "var(--green)" : st === "brief" ? "var(--amber)" : "var(--red)";
      const cells = Object.entries(det.coverage).map(([t, st]) =>
        `<code style="border-left:3px solid ${pill(st)};padding-left:5px">${esc(t)}: ${esc(st)}</code>`).join(" ");
      out += `<div class="hits">Topic coverage: ${cells}</div>`;
    }
    if (det.spread >= 2) out += `<div style="color:var(--amber);font-size:13px">Judge runs disagreed (spread ${det.spread}); worth a human spot-check.</div>`;
  } else {
    if (Array.isArray(det.hits) && det.hits.length){
      out += `<div class="hits">Flagged words: ${det.hits.map(x => `<code>${esc(x)}</code>`).join("")}</div>`;
    } else if ("count" in det){
      out += `<div>None found: full marks here.</div>`;
    }
    if ("present" in det) out += `<div>${det.present} of ${det.expected} sections filled.</div>`;
    if ("word_count" in det) out += `<div>${det.word_count} words in the body.</div>`;
    if (d.id === "photos" && "count" in det) out += `<div>${det.count} photo(s) on the profile.</div>`;
  }
  if (d.tip) out += `<div class="tip"><b>How to improve:</b> ${esc(d.tip)}</div>`;
  return out;
}

// [section key, heading, always render]. Keys are parse.py's section keys, NOT the
// judge's coverage topics: dogs, cats, and kids are one section in the template and have
// no keys of their own, so asking for them here renders three permanent blanks and drops
// HOUSEHOLD FIT entirely.
//
// The four template sections always render, so a section the writer skipped shows as a
// gap. "likes" and "housebreaking" render only when the profile has them: the template
// folds likes into ABOUT THIS PET and leaves house-training unscored, so a compliant
// profile has no such heading and printing one empty invents a gap that is not there.
const SECTION_ORDER = [
  ["about","About this pet", true],
  ["likes","Things I like", false],
  ["others","Household fit", true],
  ["training","Training", true],
  ["housebreaking","Housebreaking & crating", false],
  ["struggles","Good to know", true],
];
function renderCopy(r){
  // Collect deterministic hits to highlight in the body.
  const hits = new Set();
  for (const d of r.dimensions){
    if (Array.isArray(d.detail?.hits)) d.detail.hits.forEach(x => hits.add(x.toLowerCase()));
  }
  const hl = txt => {
    let s = esc(txt);
    for (const w of hits){
      s = s.replace(new RegExp("\\b(" + w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")\\b","gi"), "<mark>$1</mark>");
    }
    return s;
  };
  const caption = hits.size
    ? `Highlighted words are the social or screening terms the research says to cut.`
    : `No social or screening words flagged: clean on that criterion.`;
  let h = `<div class="panel copy"><h3 style="margin:0 0 4px">The profile copy</h3>
    <div style="color:var(--muted);font-size:13px;margin-bottom:6px">${caption}</div>`;
  const secs = r.sections || {};
  for (const [k, label, always] of SECTION_ORDER){
    const v = (secs[k]||"").trim();
    if (!v && !always) continue;
    h += `<h4>${label}</h4>` + (v ? `<p>${hl(v)}</p>` : `<p class="empty">empty</p>`);
  }
  return h + `</div>`;
}

boot();
</script>
</body>
</html>
