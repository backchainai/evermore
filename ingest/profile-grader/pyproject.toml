[project]
name = "profile-grader"
version = "0.1.0"
description = "Grade FOHA adoption profiles against research-backed adoption-copy guidance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
grade = "profile_grader.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: the package sits at the project root. uv_build's editable backend wrote
# an empty .pth here (deep worktree path), so the console script could not import the
# package; hatchling writes a correct editable path. The dashboard/ HTML lives inside the
# package and is picked up as package data (do NOT force-include it: force-include
# physically writes a profile_grader/ dir into site-packages that shadows the editable
# finder and breaks `import profile_grader.cli`).
packages = ["profile_grader"]
