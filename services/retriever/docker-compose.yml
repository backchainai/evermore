# Standalone Retriever infrastructure: pgvector Postgres + Jaeger.
#
# The integrated local stack (root Makefile, `make dev`/`make dev-full`) uses
# the app database in apps/stacker/docker-compose.yml, which also publishes
# host 5433 with database `retriever`. This compose mirrors that port and
# database so a Retriever-only workflow connects with the same DATABASE_URL
# (host 5433). The two app-database containers are mutually exclusive: bring up
# one or the other, not both.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: retriever
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retriever"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:latest
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

volumes:
  postgres_data:
